<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <meta name="description" content="UniCircle — the lifelong alumni network. Stay in the circle: directory, mentorship, events, city chapters and an alumni-only job board.">
  <title>UniCircle — Stay in the circle</title>
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://unicircle.eu/">
  <meta property="og:title" content="UniCircle — Stay in the circle">
  <meta property="og:description" content="The lifelong alumni network — directory, mentorship, events, city chapters and an alumni-only job board.">
  <meta property="og:image" content="https://unicircle.eu/assets/img/vrijthof.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="UniCircle — Stay in the circle">
  <meta name="twitter:description" content="The lifelong alumni network of connections.">
  <meta name="twitter:image" content="https://unicircle.eu/assets/img/vrijthof.jpg">

  <!-- Google Fonts — Manrope (body) + Instrument Serif (display) for the 2026 identity;
       Inter/Outfit kept for legacy component styles. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">

  <!-- Iconify CDN (Universal Access to 200,000+ icons) -->
  <script src="https://code.iconify.design/3/3.1.1/iconify.min.js" defer></script>

  <!-- View Transitions Opt-in for Same-Origin Multi-Document Transitions -->
  <style>
    @view-transition { navigation: auto; }
  </style>

  <!-- Custom Design Tokens and Base Styles -->
  <link rel="stylesheet" href="css/main.css?v=1.0.5">
  <!-- Component Specific Styles -->
  <link rel="stylesheet" href="css/components.css?v=1.0.5">
  <!-- Living-network layer styles (auth, chat, modals) -->
  <link rel="stylesheet" href="css/unicircle.css?v=1.0.3">
  <!-- 2026 redesign brand layer (Manrope + Instrument Serif · paper + dark nuance) -->
  <link rel="stylesheet" href="css/redesign.css?v=2.1.0">
</head>
<body>

  <!-- Accessible Skip Navigation Link -->
  <a href="#app-viewport" class="skip-link">Skip to main content</a>

  <!-- Maastricht University Branded Navigation Header -->
  <header class="global-header" role="banner">
    <div class="logo-area">
      <!-- UniCircle brand mark -->
      <img src="unicircle-logo.png" alt="UniCircle logo" class="um-logo">

      <div class="divider"></div>
      <div class="app-title">Uni<span>Circle</span> <span style="font-size: 12px; margin-left: 6px; font-weight: 500; color: var(--color-text-secondary);">unicircle.eu</span></div>
    </div>

    <!-- Navigation Menu representing a mini LinkedIn -->
    <nav class="nav-menu" aria-label="Primary Navigation">
      <div class="nav-item active" data-page="feed" role="button" tabindex="0" aria-label="Home Feed">
        <span class="iconify" data-icon="ph:house-duotone"></span>
        Home
      </div>
      <div class="nav-item" data-page="network" role="button" tabindex="0" aria-label="AI Connections Network">
        <span class="iconify" data-icon="ph:users-three-duotone"></span>
        My Network
        <span class="badge">AI</span>
      </div>
      <div class="nav-item" data-page="pbl-hub" role="button" tabindex="0" aria-label="PBL Solving Hub">
        <span class="iconify" data-icon="ph:lightbulb-filament-duotone"></span>
        PBL Hub
      </div>
      <div class="nav-item" data-page="events" role="button" tabindex="0" aria-label="Events and Classmates Overlap">
        <span class="iconify" data-icon="ph:calendar-blank-duotone"></span>
        Events
        <span class="badge" id="events-overlap-badge">3</span>
      </div>
      <div class="nav-item" data-page="jobs" role="button" tabindex="0" aria-label="Career Portal">
        <span class="iconify" data-icon="ph:briefcase-duotone"></span>
        Jobs & Premium
      </div>
      
      <div class="divider" style="height: 20px;"></div>

      <!-- User Profile Dropdown Pill -->
      <div class="nav-item" id="profile-pill" role="button" tabindex="0" aria-label="User Profile menu">
        <img src="Image_ressources/Mood_images/nikhil1256_A_man_walking_dressed_in_professional_business_attir_8fa44d19-f313-4ba2-aba1-72254228f5eb.png" alt="Jean Maurice profile picture" style="width: 26px; height: 26px; border-radius: 50%; object-fit: cover; border: 1.5px solid var(--um-light-blue);">
        Me
      </div>
    </nav>
  </header>

  <!-- Dynamic Content Viewport (SPA Mount Point) -->
  <div id="app-viewport" role="main" aria-live="polite">
    <!-- Default dynamic loading state (replaced immediately by js/app.js) -->
    <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 60vh; gap: var(--space-4);">
      <span class="iconify" data-icon="svg-spinners:ring-resize" style="font-size: 40px; color: var(--um-orange-red);"></span>
      <p style="font-family: var(--font-heading); font-weight: 600; color: var(--color-text-secondary);">Recalling network database...</p>
    </div>
  </div>

  <!-- SPA Router & Page Loader Script -->
  <script src="js/app.js?v=1.4.0" defer></script>
  <!-- Living-network layer: accounts · posting · chat · LinkedIn import -->
  <script src="js/unicircle.js?v=1.3.0" defer></script>
</body>
</html>
