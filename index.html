<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <meta name="description" content="UniCircle — the lifelong alumni network. Stay in the circle: directory, mentorship, events, city chapters and an alumni-only job board.">
  <title>UniCircle — Stay in the circle</title>
  <!-- Browser tab / favicon — UniCircle logo mark -->
  <link rel="icon" type="image/png" href="assets/img/favicon-32.png">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon-180.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#3a3934">
  <link rel="shortcut icon" href="assets/img/favicon-32.png">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://unicircle.eu/">
  <meta property="og:title" content="UniCircle — Stay in the circle">
  <meta property="og:description" content="The lifelong alumni network — directory, mentorship, events, city chapters and an alumni-only job board.">
  <meta property="og:image" content="https://unicircle.eu/assets/img/vrijthof.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="UniCircle — Stay in the circle">
  <meta name="twitter:description" content="The lifelong alumni network of connections.">
  <meta name="twitter:image" content="https://unicircle.eu/assets/img/vrijthof.jpg">

  <!-- Google Fonts — Manrope (body) + Instrument Serif (display) for the 2026 identity;
       Inter/Outfit kept for legacy component styles. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">

  <!-- Iconify CDN (Universal Access to 200,000+ icons) -->
  <script src="https://code.iconify.design/3/3.1.1/iconify.min.js" defer></script>

  <!-- View Transitions Opt-in for Same-Origin Multi-Document Transitions -->
  <style>
    @view-transition { navigation: auto; }
  </style>

  <!-- Custom Design Tokens and Base Styles -->
  <link rel="stylesheet" href="css/main.css?v=1.0.5">
  <!-- Component Specific Styles -->
  <link rel="stylesheet" href="css/components.css?v=1.0.5">
  <!-- Living-network layer styles (auth, chat, modals) -->
  <link rel="stylesheet" href="css/unicircle.css?v=1.0.3">
  <!-- 2026 redesign brand layer (Manrope + Instrument Serif · paper + dark nuance) -->
  <link rel="stylesheet" href="css/redesign.css?v=2.4.1">
  <!-- Orbit shell (right rail) + motion contract -->
  <link rel="stylesheet" href="css/uc-orbit.css?v=1.1.0">
  <!-- Page-module layer (dialogs, live cards, map) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="css/pages.css?v=1.3.0">
  <link rel="stylesheet" href="css/p-feed.css?v=1.1.0">
  <link rel="stylesheet" href="css/p-network.css?v=1.4.0">
  <link rel="stylesheet" href="css/p-events-jobs.css?v=1.3.0">
  <link rel="stylesheet" href="css/p-mentoring-cases.css?v=1.3.1">
  <link rel="stylesheet" href="css/p-map.css?v=1.3.1">
  <link rel="stylesheet" href="css/p-profile.css?v=1.1.0">
  <link rel="stylesheet" href="css/p-profile2.css?v=1.0.0">
  <link rel="stylesheet" href="css/uc-collab.css?v=1.0.0">
  <link rel="stylesheet" href="css/uc-chat.css?v=1.0.0">
</head>
<body>

  <!-- Accessible Skip Navigation Link -->
  <a href="#app-viewport" class="skip-link">Skip to main content</a>

  <!-- The old top header is gone: signed-in pages render the right-hand orbit rail
       (js/app.js railHtml), guests get the landing page's own nav pill. -->

  <!-- Dynamic Content Viewport (SPA Mount Point) -->
  <div id="app-viewport" role="main" aria-live="polite">
    <!-- Default dynamic loading state (replaced immediately by js/app.js) -->
    <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 60vh; gap: var(--space-4);">
      <span class="iconify" data-icon="svg-spinners:ring-resize" style="font-size: 40px; color: var(--um-orange-red);"></span>
      <p style="font-family: var(--font-heading); font-weight: 600; color: var(--color-text-secondary);">Recalling network database...</p>
    </div>
  </div>

  <!-- SPA Router & Page Loader Script -->
  <script src="js/uc-constellation.js?v=1.0.2" defer></script>
  <!-- Member accent colour: must run before app.js so the rail is tinted on first paint -->
  <script src="js/uc-theme.js?v=1.0.0"></script>
  <script src="js/app.js?v=1.10.0" defer></script>
  <!-- Living-network layer: accounts · posting · chat · LinkedIn import -->
  <script src="js/unicircle.js?v=1.8.0" defer></script>
  <!-- Media helpers: avatars, covers, protected files, safe image crop/upload -->
  <script src="js/uc-media.js?v=1.0.2" defer></script>
  <!-- Live chat: realtime 1:1 messages, unread nodes, rail dock -->
  <script src="js/uc-chat.js?v=1.0.2" defer></script>
  <script src="js/uc-collab.js?v=1.0.0" defer></script>
  <!-- Page modules: one init per route (contract in js/pages/_shared.js) -->
  <script src="js/pages/_shared.js?v=1.1.0" defer></script>
  <script src="js/uc-waitlist-form.js?v=1.1.0" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js" defer></script>
  <script src="js/uc-map.js?v=1.0.1" defer></script>
  <script src="js/pages/feed.js?v=1.1.0" defer></script>
  <script src="js/pages/network.js?v=1.2.0" defer></script>
  <script src="js/pages/map.js?v=1.1.0" defer></script>
  <script src="js/pages/mentoring.js?v=1.1.0" defer></script>
  <script src="js/pages/events.js?v=1.1.0" defer></script>
  <script src="js/pages/pbl-hub.js?v=1.1.0" defer></script>
  <script src="js/pages/jobs.js?v=1.1.0" defer></script>
  <script src="js/pages/benefits.js?v=1.0.0" defer></script>
  <script src="js/pages/profile.js?v=1.3.0" defer></script>
  <script src="js/pages/profile-deep.js?v=1.0.0" defer></script>
  <script src="js/pages/profile-points.js?v=1.0.0" defer></script>
  <!-- PWA: installable app shell (Android TWA wraps this). See sw.js; bump its VERSION on deploys. -->
  <script>if ('serviceWorker' in navigator) { window.addEventListener('load', function () { navigator.serviceWorker.register('/sw.js').catch(function () {}); }); }</script>
</body>
</html>
